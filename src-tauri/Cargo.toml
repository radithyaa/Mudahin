[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"

# Profil rilis dioptimalkan untuk ukuran APK (mobile):
# - `strip` membuang simbol debug (penyebab utama .so membengkak),
# - LTO + opt-level "z" memperkecil kode native,
# - panic = "abort" menghapus jalur unwinding.
# Debug build tetap apa adanya untuk pengembangan.
[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
